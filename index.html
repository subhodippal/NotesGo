      try {

      } catch {}
    </script>

    <!-- Sign-in screen -->
    <section id="login" class="login" hidden>
      <div class="login-hero">
        <img class="login-logo" src="icons/icon.svg" alt="" width="72" height="72" />
        <h1>NotesGo</h1>
        <p>Your notes, everywhere.</p>
        <button id="googleBtn" class="google-btn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z" />
          </svg>
          Continue with Google
        </button>
        <p id="loginMsg" class="login-msg" role="status"></p>
      </div>
      <ul class="login-points">
        <li><span class="lp-icon"><svg><use href="#i-people" /></svg></span>Share notes with friends</li>
        <li><span class="lp-icon"><svg><use href="#i-lock" /></svg></span>Secret notes in a locked folder</li>
        <li><span class="lp-icon"><svg><use href="#i-cloud-done" /></svg></span>Works offline, syncs when online</li>
        <li><span class="lp-icon"><svg><use href="#i-devices" /></svg></span>Mobile, PC &amp; any browser</li>
      </ul>
    </section>

    <!-- Main app -->
    <div id="app" class="app" hidden>
      <header class="hero">
        <div class="hero-inner">
          <button class="glass-btn round" id="menuBtn" type="button" aria-label="Open menu"><svg><use href="#i-menu" /></svg></button>
          <div class="hero-titles">
            <h1 id="viewTitle">NotesGo</h1>
            <button class="status" id="syncStatus" type="button">Synced</button>
          </div>
          <button class="glass-btn round" id="themeBtn" type="button" aria-label="Switch light or dark mode"><svg><use href="#i-moon" /></svg></button>
          <button class="avatar-wrap" id="avatarBtn" type="button" aria-label="Account">
            <span class="user-avatar" id="avatar"></span><span class="online-dot" id="onlineDot"></span>
          </button>
        </div>
        <div class="hero-search">
          <svg><use href="#i-search" /></svg>
          <input id="search" type="search" placeholder="Search notes, lists and tags" autocomplete="off" enterkeyhint="search" />
          <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search" hidden><svg><use href="#i-close" /></svg></button>
        </div>
      </header>

      <div class="toolbar">
        <div class="chips" id="chips" role="tablist"></div>
        <button class="tool-btn" id="selectBtn" type="button" aria-label="Select notes"><svg><use href="#i-select" /></svg></button>
        <button class="tool-btn" id="viewBtn" type="button" aria-label="Switch layout"><svg><use href="#i-grid" /></svg></button>
      </div>

      <main id="main" class="main">
        <div id="banner" class="banner" hidden></div>
        <section id="pinnedWrap" hidden>
          <h3 class="section-label"><svg><use href="#i-pin-on" /></svg>Pinned</h3>
          <div id="pinned" class="notes"></div>
        </section>
        <h3 class="section-label" id="othersLabel" hidden>Others</h3>
        <div id="others" class="notes"></div>
        <div id="empty" class="empty" hidden></div>
      </main>

      <button id="fab" class="fab" type="button" aria-label="Create"><svg><use href="#i-plus" /></svg><span>New</span></button>

      <!-- Multi-select bar -->
      <div id="selBar" class="selection-bar" hidden>
        <div class="sel-top">
          <button class="icon-btn" id="selClose" type="button" aria-label="Cancel selection"><svg><use href="#i-close" /></svg></button>
          <strong id="selCount">0 selected</strong>
          <button class="link-btn" id="selAll" type="button">Select all</button>
        </div>
        <div class="sel-actions" id="selActions"></div>
      </div>

      <!-- Side menu -->
      <div id="scrim" class="scrim" hidden></div>
      <nav id="drawer" class="drawer" aria-label="Menu" hidden>
        <div class="drawer-head">
          <span class="user-avatar" id="drawerAvatar"></span>
          <div class="drawer-user"><strong id="drawerName"></strong><small id="drawerEmail"></small></div>
        </div>
        <div class="drawer-list" id="drawerList"></div>
        <div class="drawer-foot">
          <button class="drawer-item" id="installBtn" type="button" hidden><svg><use href="#i-install" /></svg><span>Install app</span></button>
          <button class="drawer-item" id="drawerTheme" type="button"><svg><use href="#i-moon" /></svg><span id="themeLabel">Theme: System</span></button>
          <button class="drawer-item danger" id="drawerOut" type="button"><svg><use href="#i-logout" /></svg><span>Sign out</span></button>
        </div>
      </nav>

      <!-- Note editor -->
      <section id="editor" class="editor" hidden aria-label="Edit note">
        <header class="editor-top">
          <button class="icon-btn" id="edBack" type="button" aria-label="Back"><svg><use href="#i-back" /></svg></button>
          <span class="spacer"></span>
          <button class="icon-btn" id="edPin" type="button" aria-label="Pin"><svg><use href="#i-pin" /></svg></button>
          <button class="icon-btn" id="edShare" type="button" aria-label="Share"><svg><use href="#i-person-add" /></svg></button>
          <button class="icon-btn" id="edSecure" type="button" aria-label="Move to Secure folder"><svg><use href="#i-lock" /></svg></button>
          <button class="icon-btn" id="edMore" type="button" aria-label="More"><svg><use href="#i-more" /></svg></button>
        </header>
        <div class="editor-body" id="edBody">
          <div class="ed-badges" id="edBadges"></div>
          <textarea id="edTitle" class="ed-title" placeholder="Title" rows="1" maxlength="500"></textarea>
          <textarea id="edContent" class="ed-content" placeholder="Start writing…" rows="6"></textarea>
          <div id="edItems" class="checklist" hidden></div>
          <div id="edTags" class="tag-row"></div>
        </div>
        <footer class="editor-bottom">
          <button class="icon-btn" id="edColor" type="button" aria-label="Background colour"><svg><use href="#i-palette" /></svg></button>
          <button class="icon-btn" id="edTag" type="button" aria-label="Tags"><svg><use href="#i-tag" /></svg></button>
          <button class="icon-btn" id="edKind" type="button" aria-label="Switch to checklist"><svg><use href="#i-checklist" /></svg></button>
          <span class="ed-time" id="edTime"></span>
        </footer>
        <div class="palette" id="palette" hidden></div>
      </section>

      <!-- Bottom sheet (menus, pickers, dialogs) -->
      <div id="sheetScrim" class="scrim sheet-scrim" hidden></div>
      <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>

      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
    <script src="vault.js"></script>
    <script src="sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
